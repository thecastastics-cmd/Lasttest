<!DOCTYPE html>
<html lang="en">
<head>
  <title>Castastics Toys - Official Plushies & Action Figures</title>
  <meta name="description" content="Shop official Castastics Toys by David Artsy. Handmade plushies, action figures, Wave #1, #2, #3, Villains, Heroes and more.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <!-- FAST NOD: talk to Payhip early, don't block the page -->
  <link rel="preconnect" href="https://payhip.com">
  <link rel="dns-prefetch" href="https://payhip.com">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#2b4bff;color:white;font-family:Arial;text-align:center}
    .topbar{background:#4a0000;padding:10px;font-size:14px}
    .socials{display:flex;justify-content:center;gap:12px;margin:10px 0;flex-wrap:wrap}
    .socials a{background:white;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none}
    .video-wrap{max-width:900px;margin:0 auto;padding:10px} .video-wrap h2{color:#ffea00;text-align:left;font-size:18px}
    .video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px} .video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

    .tabs{margin:20px 0 10px;display:flex;justify-content:center;gap:25px;font-size:15px}
    .tabs button{background:none;border:none;color:white;font-size:15px;cursor:pointer;padding-bottom:4px;opacity:.6}
    .tabs button.active{color:#ffea00;border-bottom:3px solid #ffea00;opacity:1;font-weight:bold}

    /* GALLERY - 3 COLUMNS DESKTOP, 2 ON PHONE */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:1000px;margin:0 auto}
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
    .card{background:#1a33d6;border-radius:10px;overflow:hidden;color:white;text-align:left;content-visibility:auto}
    .card h3{color:#ffea00;font-size:14px;margin:0;padding:10px 10px 0}

    /* LITTLE BOXES - THIS IS THE GALLERY TRICK */
    .embed-box{height:340px;overflow:hidden;position:relative;background:#1a33d6}
    .embed-box .payhip-embed-page{transform:scale(0.58);transform-origin:top left;width:172%;height:580px}
    @media(max-width:700px){.embed-box{height:300px} .embed-box .payhip-embed-page{transform:scale(0.5);width:200%}}

    .pages{display:flex;justify-content:center;gap:8px;margin:0 0 20px}
    .pages button{background:white;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
    .pages button.active{background:#ffea00}
  </style>
</head>
<body>

<div class="topbar">Grab some new plushies!! ⭐ Castastics Toys ⭐</div>
<h1>Castastics Toys</h1>
<p>Official merch by David Artsy | Ages 8+</p>

  <a href="https://www.facebook.com/thedavidartsy/" target="_blank">📘</a>
  <a href="https://www.tiktok.com/@realdavidartsy/" target="_blank">🎵</a>
  <a href="https://youtube.com/@davidartsy" target="_blank">▶️</a>
  <a href="https://m.twitch.tv/davidartsylive/home" target="_blank">💜</a>
</div>

<div class="video-wrap">
  <h2>The Castastics Movie Official Trailer</h2>
  <div class="video"><iframe src="https://www.youtube.com/embed/895LbFmZZSQ" allowfullscreen></iframe></div>
</div>

<div class="tabs">
  <button id="btn-toys" class="active" onclick="showTab('toys')">TOYS (18)</button>

</div>

<!-- TOYS PAGE 1 - 6 LITTLE BOXES -->

  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="rW0nV"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="2jiIf"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="ut8wH"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="b4ulk"></div></div></div>
</div>

<!-- TOYS PAGE 2 -->
<div id="toys-page2" class="grid" style="display:none">

  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="1kz5C"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="qFHSz"></div></div></div>

  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="Wa4nj"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="zDFnP"></div></div></div>
</div>

<!-- TOYS PAGE 3 -->
<div id="toys-page3" class="grid" style="display:none">
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="xYyRG"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="41GAP"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="p6z4x"></div></div></div>

<!-- APPAREL - 1 PAGE, 3 BOXES -->

  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="0sK71"></div></div></div>
  <div class="card"><div class="embed-box"><div class="payhip-embed-page" data-key="9hYzw"></div></div></div>

<div id="toys-pager" class="pages">
  <button id="pg1" class="active" onclick="showToysPage(1)">1</button>
  <button id="pg2" onclick="showToysPage(2)">2</button>
  <button id="pg3" onclick="showToysPage(3)">3</button>
</div>

<script>
  function showTab(tab){
    document.getElementById('toys-page1').style.display='none';
    document.getElementById('toys-page2').style.display='none';
    document.getElementById('toys-page3').style.display='none';
    document.getElementById('tab-apparel').style.display='none';
    document.getElementById('toys-pager').style.display='none';
    document.getElementById('btn-toys').classList.remove('active');
    document.getElementById('btn-apparel').classList.remove('active');
    if(tab==='toys'){document.getElementById('toys-page1').style.display='grid';document.getElementById('toys-pager').style.display='flex';document.getElementById('btn-toys').classList.add('active');}
    else{document.getElementById('tab-apparel').style.display='grid';document.getElementById('btn-apparel').classList.add('active');}
    window.scrollTo({top:document.querySelector('.tabs').offsetTop-10,behavior:'smooth'});
  }
  function showToysPage(n){
    document.getElementById('toys-page1').style.display='none';
    document.getElementById('toys-page2').style.display='none';
    document.getElementById('toys-page3').style.display='none';
    document.getElementById('toys-page'+n).style.display='grid';
    document.getElementById('pg1').classList.remove('active');
    document.getElementById('pg2').classList.remove('active');
    document.getElementById('pg3').classList.remove('active');
    document.getElementById('pg'+n).classList.add('active');
    window.scrollTo({top:document.querySelector('.tabs').offsetTop-10,behavior:'smooth'});
  }
</script>
<script type="text/javascript" src="https://payhip.com/embed-page.js?v=24u68985" defer></script>
